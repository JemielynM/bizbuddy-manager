<div class="container">

  <!-- Title -->
  <h1>Customer Manager</h1>

  <!-- Add Customer -->
  <div class="card">
    <h2>Add Customer</h2>

    <div class="form-row">
      <input type="text" placeholder="Name" [(ngModel)]="newCustomer.name">
      <input type="text" placeholder="Phone" [(ngModel)]="newCustomer.phone">
      <input type="email" placeholder="Email" [(ngModel)]="newCustomer.email">

      <button type="button" (click)="addCustomer()">Add</button>
    </div>
  </div>

  <!-- Edit Customer -->
  <div class="card" *ngIf="editingCustomer">
    <h2>Edit Customer</h2>

    <div class="form-row">
      <input type="text" [(ngModel)]="editingCustomer.name" placeholder="Name">
      <input type="text" [(ngModel)]="editingCustomer.phone" placeholder="Phone">
      <input type="email" [(ngModel)]="editingCustomer.email" placeholder="Email">

      <button type="button" (click)="updateCustomer()">Update</button>
      <button type="button" (click)="editingCustomer = null">Cancel</button>
    </div>
  </div>

  <!-- Customers List -->
  <div class="card">
    <h2>Customers</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let customer of customers">
          <td>{{ customer.id }}</td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.phone }}</td>
          <td>{{ customer.email }}</td>

          <td>
            <!-- IMPORTANT: direct assignment -->
            <button type="button" (click)="editCustomer(customer)">Edit</button>

            <button type="button" (click)="deleteCustomer(customer.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
